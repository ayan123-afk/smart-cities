<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏙️ 3D Smart City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: Arial, sans-serif;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
        }
        #loading .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #loading p {
            color: #94a3b8;
            margin-top: 10px;
        }
        .loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }
        .loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Controls Info */
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            border: 1px solid rgba(0, 255, 136, 0.3);
            text-align: center;
            pointer-events: none;
        }
        #info span {
            color: #00ff88;
            font-weight: bold;
        }
        #info .keys {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 4px;
        }
        #info .key {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <h1>🏙️ Smart City Pro</h1>
        <p>Building your future city...</p>
        <div class="loading-bar">
            <div class="loading-fill" id="loadingFill"></div>
        </div>
    </div>

    <!-- Info -->
    <div id="info">
        🖱️ <span>Drag</span> to rotate · <span>Scroll</span> to zoom · Click buildings for details
        <div class="keys">
            <span class="key">🏥 Hospital</span>
            <span class="key">🏫 School</span>
            <span class="key">💧 Water Plant</span>
            <span class="key">🌿 Garden</span>
        </div>
    </div>

    <div id="root"></div>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Main App -->
    <script>
        // ============================================
        // COMPLETE SMART CITY - All in One
        // ============================================

        // --- Zustand Store (State Management) ---
        const { create } = window.Zustand || { create: (fn) => fn() };

        // Simple state management
        const useStore = (() => {
            let state = {
                alert: null,
                focus: null,
                timeOfDay: 'day',
                streetLightsOn: false,
                wasteBins: {},
                alertWasteManagement: false,
                collectedWaste: 0,
                gardenSensors: {
                    soilMoisture: 65,
                    temperature: 24,
                    humidity: 45,
                    waterLevel: 80,
                    isWatering: false
                },
                waterPlant: {
                    isProcessing: false,
                    processTime: 0,
                    waterQuality: 95,
                    filteredWater: 0,
                    efficiency: 85
                }
            };

            const listeners = [];

            const setState = (newState) => {
                state = { ...state, ...newState };
                listeners.forEach(fn => fn(state));
            };

            const subscribe = (fn) => {
                listeners.push(fn);
                return () => {
                    const idx = listeners.indexOf(fn);
                    if (idx > -1) listeners.splice(idx, 1);
                };
            };

            const getState = () => state;

            return {
                getState,
                setState,
                subscribe,
                // Individual getters for compatibility
                get: (selector) => selector(state),
                set: (fn) => {
                    const newState = fn(state);
                    setState(newState);
                }
            };
        })();

        // React and Three.js
        const React = window.React;
        const ReactDOM = window.ReactDOM;
        const THREE = window.THREE;

        // --- React Three Fiber Setup ---
        const { Canvas, useFrame, useThree } = window['@react-three/fiber'] || {};
        const { OrbitControls, Html, useGLTF, ContactShadows, Sky, Text, Sparkles, Float, useTexture } = window[
        '@react-three/drei'] || {};

        // Fallback if libraries not loaded
        if (!Canvas) {
            document.getElementById('loading').innerHTML = `
                    <h1 style="color:red;">⚠️ Error</h1>
                    <p style="color:white;">Libraries not loaded. Please check internet connection.</p>
                    <p style="color:#94a3b8;font-size:14px;">Make sure you have internet access to load CDN resources.</p>
                `;
            throw new Error('Required libraries not loaded');
        }

        // ============================================
        // COMPONENTS
        // ============================================

        // --- Solar Panel ---
        function SolarPanel({ position = [0, 0, 0], rotation = [0, 0, 0] }) {
            return React.createElement('group', { position, rotation },
                React.createElement('mesh', { castShadow: true, receiveShadow: true },
                    React.createElement('boxGeometry', { args: [2, 0.1, 1.5] }),
                    React.createElement('meshStandardMaterial', { color: '#3366cc', metalness: 0.6, roughness: 0.2 })
                ),
                React.createElement('mesh', { position: [0, 0.06, 0] },
                    React.createElement('boxGeometry', { args: [2, 0.02, 1.5] }),
                    React.createElement('meshStandardMaterial', { color: '#4488ff', metalness: 0.8, roughness: 0.1 })
                )
            );
        }

        // --- Wind Turbine ---
        function WindTurbine({ position = [0, 0, 0] }) {
            const bladeRef = React.useRef();
            useFrame((_, delta) => {
                if (bladeRef.current) {
                    bladeRef.current.rotation.y += delta * 2;
                }
            });

            return React.createElement('group', { position },
                React.createElement('mesh', { position: [0, 5, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.1, 0.15, 10, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#cccccc', metalness: 0.5 })
                ),
                React.createElement('mesh', { position: [0, 10, 0], castShadow: true },
                    React.createElement('boxGeometry', { args: [0.5, 0.2, 0.5] }),
                    React.createElement('meshStandardMaterial', { color: '#999999', metalness: 0.7 })
                ),
                React.createElement('group', { ref: bladeRef },
                    [0, 120, 240].map((angle) =>
                        React.createElement('mesh', { key: angle, position: [0, 10, 0], rotation: [0, 0, angle * Math.PI /
                                180] },
                            React.createElement('mesh', { position: [4, 0, 0], castShadow: true },
                                React.createElement('boxGeometry', { args: [8, 0.4, 0.5] }),
                                React.createElement('meshStandardMaterial', { color: '#dddddd', metalness: 0.4,
                                    roughness: 0.6 })
                            )
                        )
                    )
                ),
                React.createElement('mesh', { position: [0, 10.3, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.3, 8, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#aaaaaa', metalness: 0.8 })
                )
            );
        }

        // --- Enhanced Building ---
        function EnhancedBuilding({ position = [0, 0, 0], height = 12, color = '#4a6572', name = 'Building',
            hasTurbine = false, hasSolar = true, windows = true }) {
            const setFocus = useStore.get('setFocus');
            const timeOfDay = useStore.get('timeOfDay');

            const handleClick = () => {
                if (setFocus) {
                    setFocus({
                        x: position[0],
                        y: position[1] + height / 2,
                        z: position[2],
                        lookAt: { x: position[0], y: position[1], z: position[2] }
                    });
                }
            };

            const isNight = timeOfDay === 'night';

            return React.createElement('group', { position },
                // Main Building
                React.createElement('mesh', { castShadow: true, receiveShadow: true, onClick: handleClick },
                    React.createElement('boxGeometry', { args: [5, height, 5] }),
                    React.createElement('meshStandardMaterial', { color, roughness: 0.6, metalness: 0.2 })
                ),
                // Top trim
                React.createElement('mesh', { position: [0, height / 2 + 0.3, 0], castShadow: true },
                    React.createElement('boxGeometry', { args: [5.4, 0.6, 5.4] }),
                    React.createElement('meshStandardMaterial', { color: '#34495e' })
                ),
                // Windows
                windows && Array.from({ length: Math.floor(height / 3) }).map((_, floor) =>
                    [-1.5, 0, 1.5].map((side) =>
                        React.createElement('group', { key: `${floor}-${side}` },
                            React.createElement('mesh', { position: [2.51, (floor * 3) - height / 2 + 3, side * 1.2],
                                    castShadow: true },
                                React.createElement('boxGeometry', { args: [0.02, 2, 1] }),
                                React.createElement('meshStandardMaterial', {
                                    color: isNight ? '#ffffcc' : '#87CEEB',
                                    transparent: true,
                                    opacity: isNight ? 0.9 : 0.7,
                                    emissive: isNight ? '#ffff99' : '#000000',
                                    emissiveIntensity: isNight ? 0.5 : 0
                                })
                            )
                        )
                    )
                ),
                // Solar Panels
                hasSolar && React.createElement('group', { position: [0, height / 2 + 0.8, 0] },
                    React.createElement(SolarPanel, { position: [0, 0, 0], rotation: [0, 0, 0] }),
                    React.createElement(SolarPanel, { position: [2.2, 0, 1.5], rotation: [0, Math.PI / 4, 0] }),
                    React.createElement(SolarPanel, { position: [-2.2, 0, 1.5], rotation: [0, -Math.PI / 4, 0] })
                ),
                // Wind Turbine
                hasTurbine && React.createElement(WindTurbine, { position: [0, height / 2, 0] }),
                // Label
                React.createElement(Text, {
                    position: [0, height / 2 + 2, 0],
                    fontSize: 0.3,
                    color: '#ffffff',
                    anchorX: 'center',
                    anchorY: 'middle'
                }, name)
            );
        }

        // --- Waste Bin ---
        function WasteBin({ position = [0, 0, 0], id = 'bin1' }) {
            const wasteBins = useStore.get('wasteBins');
            const updateWasteBin = useStore.get('updateWasteBin');
            const setAlertWasteManagement = useStore.get('setAlertWasteManagement');
            const setCollectedWaste = useStore.get('setCollectedWaste');
            const alertWasteManagement = useStore.get('alertWasteManagement');
            const collectedWaste = useStore.get('collectedWaste');
            const timeOfDay = useStore.get('timeOfDay');

            const wasteLevel = (wasteBins && wasteBins[id]) || 20;

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (wasteLevel < 100) {
                        const newLevel = Math.min(100, wasteLevel + Math.random() * 2);
                        if (updateWasteBin) updateWasteBin(id, newLevel);
                        if (newLevel > 80 && !alertWasteManagement && setAlertWasteManagement) {
                            setAlertWasteManagement(true);
                        }
                    }
                }, 5000);
                return () => clearInterval(interval);
            }, [wasteLevel, id]);

            const handleClick = () => {
                if (updateWasteBin) {
                    updateWasteBin(id, 0);
                    if (setCollectedWaste) setCollectedWaste((collectedWaste || 0) + 50);
                    if (setAlertWasteManagement) setAlertWasteManagement(false);
                }
            };

            const color = wasteLevel > 80 ? '#e74c3c' : wasteLevel > 50 ? '#f39c12' : '#2ecc71';
            const isNight = timeOfDay === 'night';

            return React.createElement('group', { position, onClick: handleClick },
                React.createElement('mesh', { castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.8, 0.8, 1.5, 16] }),
                    React.createElement('meshStandardMaterial', { color })
                ),
                React.createElement('mesh', { position: [0, 0.75, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.85, 0.85, 0.1, 16] }),
                    React.createElement('meshStandardMaterial', { color: '#34495e' })
                ),
                React.createElement('mesh', { position: [0, 1.55, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.9, 0.9, 0.05, 16] }),
                    React.createElement('meshStandardMaterial', { color: '#2c3e50' })
                ),
                React.createElement(Text, {
                    position: [0, 2, 0],
                    fontSize: 0.3,
                    color,
                    anchorX: 'center',
                    anchorY: 'middle'
                }, Math.round(wasteLevel) + '%'),
                React.createElement(Text, {
                    position: [0, 2.5, 0],
                    fontSize: 0.2,
                    color: 'white',
                    anchorX: 'center',
                    anchorY: 'middle'
                }, '🗑️ ' + id),
                isNight && React.createElement('pointLight', {
                    position: [0, 2, 0],
                    intensity: 0.3,
                    color,
                    distance: 3
                })
            );
        }

        // --- Wheelchair User ---
        function WheelchairUser({ position = [0, 0, 0], moving = false }) {
            const groupRef = React.useRef();
            useFrame((_, delta) => {
                if (moving && groupRef.current) {
                    groupRef.current.position.x += Math.sin(Date.now() / 1000) * 0.02;
                }
            });

            return React.createElement('group', { ref: groupRef, position },
                React.createElement('mesh', { position: [0, 0.3, 0], castShadow: true },
                    React.createElement('boxGeometry', { args: [0.8, 0.2, 0.8] }),
                    React.createElement('meshStandardMaterial', { color: '#34495e' })
                ),
                React.createElement('mesh', { position: [0, 0.6, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.2, 0.2, 0.6, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#e74c3c' })
                ),
                React.createElement('mesh', { position: [0, 1, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.15, 8, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#ffdbac' })
                ),
                React.createElement(Text, {
                    position: [0, 1.3, 0],
                    fontSize: 0.3,
                    color: 'white',
                    anchorX: 'center',
                    anchorY: 'middle'
                }, '♿')
            );
        }

        // --- Person ---
        function Person({ position = [0, 0, 0], color = '#8b4513', speed = 0.2, path = null }) {
            const groupRef = React.useRef();
            const [pathIndex, setPathIndex] = React.useState(0);

            useFrame((_, delta) => {
                if (groupRef.current && path && path.length > 1) {
                    const current = path[pathIndex % path.length];
                    const next = path[(pathIndex + 1) % path.length];
                    const dx = next[0] - current[0];
                    const dz = next[2] - current[2];
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    if (distance < 0.01) {
                        setPathIndex((prev) => (prev + 1) % path.length);
                        return;
                    }
                    const step = speed * delta * 2;
                    groupRef.current.position.x += (dx / distance) * step;
                    groupRef.current.position.z += (dz / distance) * step;
                    if (Math.abs(groupRef.current.position.x - next[0]) < 0.1 &&
                        Math.abs(groupRef.current.position.z - next[2]) < 0.1) {
                        setPathIndex((prev) => (prev + 1) % path.length);
                    }
                }
            });

            return React.createElement('group', { ref: groupRef, position },
                React.createElement('mesh', { position: [0, 0.6, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.2, 0.2, 0.6, 8] }),
                    React.createElement('meshStandardMaterial', { color })
                ),
                React.createElement('mesh', { position: [0, 1.1, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.15, 8, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#ffdbac' })
                ),
                React.createElement(Text, {
                    position: [0, 1.5, 0],
                    fontSize: 0.2,
                    color: 'white',
                    anchorX: 'center',
                    anchorY: 'middle'
                }, '👤')
            );
        }

        // --- Street Light ---
        function StreetLight({ position = [0, 0, 0], rotation = [0, 0, 0] }) {
            const timeOfDay = useStore.get('timeOfDay');
            const streetLightsOn = useStore.get('streetLightsOn');
            const isOn = streetLightsOn || timeOfDay === 'night';

            return React.createElement('group', { position, rotation },
                React.createElement('mesh', { position: [0, 3, 0], castShadow: true },
                    React.createElement('cylinderGeometry', { args: [0.08, 0.1, 6, 8] }),
                    React.createElement('meshStandardMaterial', { color: '#666666' })
                ),
                React.createElement('mesh', { position: [0, 6, 0.5], castShadow: true },
                    React.createElement('boxGeometry', { args: [0.4, 0.2, 0.6] }),
                    React.createElement('meshStandardMaterial', { color: '#444444' })
                ),
                React.createElement('mesh', { position: [0, 6, 0.8], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.15, 8, 8] }),
                    React.createElement('meshStandardMaterial', {
                        color: isOn ? '#ffffcc' : '#666666',
                        emissive: isOn ? '#ffff99' : '#000000',
                        emissiveIntensity: isOn ? 1 : 0
                    })
                ),
                isOn && React.createElement('pointLight', {
                    position: [0, 6, 0.8],
                    intensity: 0.8,
                    distance: 15,
                    color: '#ffffcc',
                    castShadow: true
                })
            );
        }

        // --- Street Light System ---
        function StreetLightSystem() {
            const lightPositions = [
                ...Array.from({ length: 20 }).map((_, i) => [-50 + i * 5, 0, 0]),
                ...Array.from({ length: 20 }).map((_, i) => [0, 0, -50 + i * 5]),
                ...Array.from({ length: 16 }).map((_, i) => [-40 + i * 5, 0, -25]),
                ...Array.from({ length: 16 }).map((_, i) => [-40 + i * 5, 0, 25]),
                ...Array.from({ length: 16 }).map((_, i) => [-25, 0, -40 + i * 5]),
                ...Array.from({ length: 16 }).map((_, i) => [25, 0, -40 + i * 5]),
                [15, 0, 15],
                [-15, 0, 15],
                [0, 0, 0],
                [-8, 0, -2],
                [8, 0, -6],
                [10, 0, 25],
                [-10, 0, 25],
                [0, 0, 20],
                [-30, 0, 15],
                [30, 0, -15],
                [-25, 0, 25],
                [25, 0, -25],
                [-20, 0, -30],
                [20, 0, 30],
                [-10, 0, -25],
                [10, 0, 25],
                [-35, 0, -35],
                [35, 0, 35],
                [-35, 0, 35],
                [35, 0, -35],
                [0, 0, -45],
                [0, 0, 45],
                [-45, 0, 0],
                [45, 0, 0]
            ];

            return React.createElement('group', null,
                lightPositions.map((pos, index) =>
                    React.createElement(StreetLight, { key: index, position: pos })
                )
            );
        }

        // --- Monitoring Drone ---
        function MonitoringDrone({ position = [0, 0, 0], isMonitoring = false }) {
            const droneRef = React.useRef();
            const timeOfDay = useStore.get('timeOfDay');

            useFrame((_, delta) => {
                if (droneRef.current && isMonitoring) {
                    droneRef.current.position.x += Math.sin(Date.now() / 2000) * 0.005;
                    droneRef.current.position.z += Math.cos(Date.now() / 3000) * 0.005;
                    droneRef.current.position.y += Math.sin(Date.now() / 1500) * 0.002;
                }
            });

            const isNight = timeOfDay === 'night';

            return React.createElement('group', { ref: droneRef, position },
                React.createElement('mesh', { castShadow: true },
                    React.createElement('boxGeometry', { args: [1, 0.15, 1] }),
                    React.createElement('meshStandardMaterial', { color: '#333333', metalness: 0.8 })
                ),
                React.createElement('mesh', { position: [0, 0.1, 0], castShadow: true },
                    React.createElement('sphereGeometry', { args: [0.15, 8, 8] }),
                    React.createElement('meshStandardMaterial', {
                        color: isMonitoring ? '#e74c3c' : '#2ecc71',
                        emissive: isMonitoring ? '#e74c3c' : '#2ecc71',
                        emissiveIntensity: 0.5
                    })
                ),
                [0, 1, 2, 3].map((i) => {
                    const angle = (i / 4) * Math.PI * 2;
                    return React.createElement('mesh', {
                        key: i,
                        position: [Math.cos(angle) * 0.7, 0.1, Math.sin(angle) * 0.7],
                        castShadow: true
                    },
                        React.createElement('cylinderGeometry', { args: [0.02, 0.02, 0.4, 8] }),
                        React.createElement('meshStandardMaterial', { color: '#666666' })
                    );
                }),
                React.createElement(Text, {
                    position: [0, 0.5, 0],
                    fontSize: 0.2,
                    color: 'white',
                    anchorX: 'center',
                    anchorY: 'middle'
                }, '🚁'),
                isNight && React.createElement('pointLight', {
                    position: [0, 0.2, 0],
                    intensity: 0.5,
                    color: '#e74c3c',
                    distance: 2
                })
            );
        }

        // --- Water Filtering Plant ---
        function WaterFilteringPlant({ position = [0, 0, 0] }) {
            const setFocus = useStore.get('setFocus');
            const waterPlant = useStore.get('waterPlant');
            const setWaterPlant = useStore.get('setWaterPlant');
            const timeOfDay = useStore.get('timeOfDay');
            const [waterParticles, setWaterParticles] = React.useState([]);
            const [filterActive, setFilterActive] = React.useState(false);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    if (setWaterPlant) {
                        setWaterPlant(prev => {
                            const shouldProcess = Math.random() > 0.7 && !prev.isProcessing;
                            const isProcessing = shouldProcess ? true : (prev.isProcessing && prev.processTime < 2);
                            const newProcessTime = isProcessing ? prev.processTime + 0.5 : 0;
                            const newFilteredWater = isProcessing ? prev.filteredWater + 10 : prev.filteredWater;
                            const newWaterQuality = Math.max(80, Math.min(99, prev.waterQuality + (Math
                            .random() - 0.5) * 5));

                            if (isProcessing && !filterActive) setFilterActive(true);
                            else if (!isProcessing && filterActive) setFilterActive(false);

                            if (newProcessTime >= 2) {
                                return {
                                    isProcessing: false,
                                    processTime: 0,
                                    waterQuality: newWaterQuality,
                                    filteredWater: newFilteredWater,
                                    efficiency: Math.max(75, Math.min(95, prev.efficiency + (Math.random() - 0.5) *
                                        3))
                                };
                            }
                            return { ...prev, isProcessing, processTime: newProcessTime, waterQuality: newWaterQuality,
                                filteredWater: newFilteredWater };
                        });
                    }
                }, 2000);
                return () => clearInterval(interval);
            }, [setWaterPlant, filterActive]);

            useFrame((_, dt) => {
                if (filterActive && Math.random() < 0.3) {
                    setWaterParticles(prev => [

        function App() {
            const controlsRef = React.useRef();
            const focus = useStore.get('focus');

            // Set up store with functions
            React.useEffect(() => {
                useStore.setState({
                    setFocus: (f) => useStore.setState({ focus: f }),
                    setAlertWasteManagement: (alert) => useStore.setState({ alertWasteManagement: alert }),
                    setCollectedWaste: (fn) => {
                        const current = useStore.getState().collectedWaste || 0;
                        const newVal = typeof fn === 'function' ? fn(current) : fn;
                        useStore.setState({ collectedWaste: newVal });
                    },
                    updateWasteBin: (id, level) => {
                        const bins = useStore.getState().wasteBins || {};
                        useStore.setState({ wasteBins: { ...bins, [id]: level } });
                    },
                    setWaterPlant: (fn) => {
                        const current = useStore.getState().waterPlant || { isProcessing: false, processTime: 0,
                            waterQuality: 95, filteredWater: 0, efficiency: 85 };
                        const newVal = typeof fn === 'function' ? fn(current) : fn;
                        useStore.setState({ waterPlant: newVal });
                    }
                });

                // Set initial waste bins
                const bins = {};
                ['bin1', 'bin2', 'bin3', 'bin4', 'bin5', 'bin6'].forEach(id => {
                    bins[id] = 20 + Math.random() * 40;
                });
                useStore.setState({ wasteBins: bins });

                // Loading complete
                const fill = document.getElementById('loadingFill');
                if (fill) {
                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += 10;
                        fill.style.width = progress + '%';
                        if (progress >= 100) {
                            clearInterval(interval);
                            setTimeout(() => {
                                document.getElementById('loading').style.display = 'none';
                            }, 300);
                        }
                    }, 100);
                } else {
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 1000);
                }
            }, []);

            React.useEffect(() => {
                if (focus && controlsRef.current) {
                    const { x, y, z, lookAt } = focus;
                    controlsRef.current.target.set(lookAt.x, lookAt.y, lookAt.z);
                    controlsRef.current.object.position.set(x, y, z);
                }
            }, [focus]);
